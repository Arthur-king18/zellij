name: Zelmux build

# Builds the reviewed snowzhangy fork commit (d156a46) for the server, mirroring upstream release.yml
on:
  push:
    branches: [zelmux-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check that only this workflow was added on top of the reviewed commit
        run: |
          test "$(git rev-parse HEAD~1)" = d156a46bd302347152e694138af7ae2e77f8eea3
          test "$(git diff --name-only HEAD~1 HEAD)" = .github/workflows/zelmux-build.yml

      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install musl-tools
        run: sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: "${{ env.TARGET }},wasm32-wasip1"
          cache: false
          rustflags: ""

      - name: Build release binary (cross-compiled)
        run: cargo xtask ci cross $TARGET

      - name: Package
        run: |
          tar cvzf "zellij-$TARGET.tar.gz" -C "target/$TARGET/release" zellij
          sha256sum "target/$TARGET/release/zellij" | tee "zellij-$TARGET.sha256sum"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zellij-zelmux-${{ env.TARGET }}
          path: |
            zellij-${{ env.TARGET }}.tar.gz
            zellij-${{ env.TARGET }}.sha256sum
          retention-days: 30
